    }

      text-transform: uppercase;
      color: rgba(255,255,255,0.9);

    .header h1 {

      color: rgba(255,255,255,0.45);

    // Avatar color palette (warm, accessible)
    const COLORS = [
      '#E8927C','#7CAABD','#9DB87C','#C49BDB',
      '#D4A76A','#7CC5C0','#D47C9B','#8E9FD4',
      '#C7B46C','#6CBAA7','#C48484','#8ABDE0',
      '#B8A0D4','#D4976C','#7CB89D','#C4747C'
    ];

    function slugify(name) {
      return name.toLowerCase()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '');
    }

    function getInitials(name) {
      const parts = name.split(/\s+/);
      if (parts.length === 1) return parts[0][0].toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function getColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return COLORS[Math.abs(hash) % COLORS.length];
    }

    function linkedinIcon() {
      return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';
    }

    function githubIcon() {
      return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>';
    }

    function renderCard(guest, index) {
      const slug = slugify(guest.name);
      const initials = getInitials(guest.name);
      const color = getColor(guest.name);
      const delay = Math.min(index * 0.03, 0.6);

      const roleCompany = guest.company
        ? `${guest.role} @ ${guest.company}`
        : guest.role;

      let linksInner = '';
      if (guest.linkedin) {
        linksInner += `<a href="${guest.linkedin}" target="_blank" rel="noopener noreferrer" title="LinkedIn">${linkedinIcon()}</a>`;
      }
      if (guest.github) {
        linksInner += `<a href="${guest.github}" target="_blank" rel="noopener noreferrer" title="GitHub">${githubIcon()}</a>`;
      }

      return `
        <div class="card" data-search="${esc((guest.name + ' ' + guest.role + ' ' + guest.company + ' ' + guest.bio + ' ' + guest.building).toLowerCase())}">
          <div class="card-header">
            <div class="avatar-frame">
              <img
                class="avatar"
                src="${BASE}/avatars/${slug}.jpg"
                alt="${esc(guest.name)}"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
                loading="lazy"
              >
              <div class="initials" style="display:none;background:${color}">${initials}</div>
            </div>
            <div class="card-identity">
              <div class="card-name">${esc(guest.name)}</div>
              <div class="card-role">${esc(roleCompany)}</div>
            </div>
          </div>
          <div class="card-building">${esc(guest.building)}</div>
          <div class="card-context">
            <div class="card-field-label">Background</div>
            <div class="card-bio">${esc(guest.bio)}</div>
          </div>
          <div class="card-links">${linksInner}</div>
        </div>
      `;
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // Alphabetical by first name
    GUESTS.sort((a, b) => a.name.localeCompare(b.name));

    // Initial render
    const grid = document.getElementById('grid');
    grid.innerHTML = GUESTS.map((g, i) => renderCard(g, i)).join('');

    // Scroll-triggered card entrance
    const cardObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const card = entry.target;
          // Stagger within each row of 3
          const visibleCards = [...grid.querySelectorAll('.card.visible')].length;
          const col = visibleCards % 3;
          card.style.transitionDelay = `${col * 0.08}s`;
          card.classList.add('visible');
          cardObserver.unobserve(card);
        }
      });
    }, { threshold: 0.05 });

    grid.querySelectorAll('.card').forEach(card => cardObserver.observe(card));

    // Search
    const searchInput = document.getElementById('search');
    const searchCount = document.getElementById('search-count');
    const guestCount = document.getElementById('guest-count');
    let debounceTimer;

    searchInput.addEventListener('input', function() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(filterCards, 150);
    });

    function filterCards() {
      const q = searchInput.value.toLowerCase().trim();
      const cards = grid.querySelectorAll('.card');
      let visible = 0;

      cards.forEach((card) => {
        const match = !q || card.dataset.search.includes(q);
        card.style.display = match ? '' : 'none';
        if (match) {
          // Ensure visible cards are shown
          card.classList.add('visible');
          card.style.transitionDelay = `${(visible % 3) * 0.05}s`;
          visible++;
        }
      });

      if (q) {
        searchCount.textContent = visible + ' of ' + GUESTS.length;
        guestCount.textContent = visible + ' match' + (visible !== 1 ? 'es' : '');
      } else {
        searchCount.textContent = '';
        guestCount.textContent = GUESTS.length + ' builders';
      }

      // Show empty state
      const existing = grid.querySelector('.empty');
      if (existing) existing.remove();
      if (visible === 0 && q) {
        grid.innerHTML += `<div class="empty">
          <div class="empty-icon">&#x1f50d;</div>
          <div class="empty-title">No builders match "${esc(q)}"</div>
          <div class="empty-sub">Try a different name, company, or project.</div>
        </div>`;
      }
    }

    // Sticky search shadow
    const searchWrap = document.getElementById('search-wrap');
    const observer = new IntersectionObserver(
      ([e]) => searchWrap.classList.toggle('scrolled', !e.isIntersecting),
      { threshold: [1], rootMargin: '-1px 0px 0px 0px' }
    );
    observer.observe(searchWrap);

    // Keyboard shortcut: focus search on /
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        filterCards();
        searchInput.blur();
      }
    });
  </script>
